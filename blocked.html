<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locked — Math Coach</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <div class="card narrow center" style="margin-top: 10vh">
      <div class="huge">🔒</div>
      <h1 id="title">This page is locked</h1>
      <p id="msg" class="muted">The browser is locked for math practice right now.</p>
      <p class="muted small">Finish today's 10 questions to unlock browsing. Need a website for school? Ask a parent to add it in the Parent area.</p>
      <button id="go" class="primary big">Go to my math practice →</button>
      <p><button id="parent" class="ghost small">👪 Parent: unlock with PIN</button></p>
    </div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
